# HiveTalk API on Fly.io — deploy from repo root:
#   fly launch --no-deploy   # first time (or use this file)
#   fly secrets set ...
#   fly deploy

app = "hivetalk-api"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"
  DATABASE_URL = "file:./prisma/dev.db"
  COOKIE_SECURE = "true"
  COOKIE_SAME_SITE = "none"
  JWT_EXPIRES_IN = "7d"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
